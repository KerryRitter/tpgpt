[package]
name = "tpgpt"
version = "0.1.0"
description = "Native TrainingPeaks login, SQLite import, and CLI chat"
edition = "2021"
rust-version = "1.88"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_commonmark = { version = "0.22", default-features = false }
wry = "0.55"
tao = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
base64 = "0.22"
flate2 = "1"
fitparser = "0.10"
quick-xml = { version = "0.41", features = ["serialize"] }
directories = "6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
